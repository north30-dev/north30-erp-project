# 生产环境配置（敏感信息必须通过环境变量或配置中心注入，仓库中不保存明文密码）
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

# 生产环境关闭 debug 日志
logging:
  level:
    root: info

# 生产环境关闭 API 文档，不对外暴露接口契约
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
