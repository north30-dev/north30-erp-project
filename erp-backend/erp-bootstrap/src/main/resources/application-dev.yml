# 开发环境配置（本机 PostgreSQL 18 + 本机 Redis）
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_db
    username: erp_user
    password: erp_password
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      database: 0  # 缓存数据库索引（默认 0）

# 开发期打印 SQL 便于调试
logging:
  level:
    me.north30.erp: debug
