# ERP 后端基础配置（D1 骨架阶段）
spring:
  application:
    name: erp-backend
  servlet:
    encoding:            # Boot 4 写法（旧写法 server.servlet.encoding 已废弃）
      charset: UTF-8
      force: true
  datasource:
    url: jdbc:postgresql://localhost:5432/erp
    username: erp
    password: erp@123456
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: root

server:
  port: 8080

# MyBatis-Plus 配置（D1 骨架：逻辑删除 + 驼峰映射；分页/乐观锁插件见 MybatisPlusConfig）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted     # 逻辑删除字段（对应 BaseEntity.isDeleted，SMALLINT）
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

