# ERP 后端公共配置（各环境差异见 application-{dev|test|prod}.yml）
spring:
  application:
    name: erp-backend
  profiles:
    default: dev          # 本地启动默认使用 dev 环境，部署时用 --spring.profiles.active=prod 覆盖
  servlet:
    encoding:            # Boot 4 写法（旧写法 server.servlet.encoding 已废弃）
      charset: UTF-8
      force: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  data:
    redis:
      host: localhost
      port: 6379
      password: root
      database: 0
      timeout: 3000ms

server:
  port: 8080

# MyBatis-Plus 配置（逻辑删除 + 驼峰映射；分页/乐观锁插件见 MybatisPlusConfig）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted     # 逻辑删除字段（对应 BaseEntity.isDeleted，SMALLINT）
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置（详细设计 2.5）：secret 生产环境必须通过环境变量 ERP_JWT_SECRET 覆盖，禁止入库入日志
erp:
  jwt:
    secret: ${ERP_JWT_SECRET:north30-erp-dev-secret-0123456789abcdef0123456789abcdef-override-me}
    access-ttl: 2h       # access token 有效期 120 分钟（expiresIn=7200 秒）
    refresh-ttl: 7d      # refresh token 有效期 7 天（刷新不延长）
    issuer: north30-erp
  attachment:
    store-path: ${ERP_ATTACHMENT_STORE_PATH:/tmp/erp-attachments}   # 附件本地存储根目录（SYS-10，生产环境用环境变量覆盖）
