# ERP 后端公共配置（各环境差异见 application-{dev|test|prod}.yml）
spring:
  application:
    name: erp-backend
  profiles:
    default: dev          # 本地启动默认使用 dev 环境，部署时用 --spring.profiles.active=prod 覆盖
  servlet:
    encoding:            # Boot 4 写法（旧写法 server.servlet.encoding 已废弃）
      charset: UTF-8
      force: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080

# MyBatis-Plus 配置（D1 骨架：逻辑删除 + 驼峰映射；分页/乐观锁插件见 MybatisPlusConfig）
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: isDeleted     # 逻辑删除字段（对应 BaseEntity.isDeleted，SMALLINT）
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

